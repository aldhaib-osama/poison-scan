[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "poisonscan"
version = "0.1.0"
description = "Offline dataset-poisoning auditor for text classification data, with ground-truth evaluation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
poisonscan = "poisonscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
